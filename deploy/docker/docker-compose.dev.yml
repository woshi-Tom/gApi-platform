# 前端开发模式 - 热更新
# 使用方法：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d frontend
services:
  frontend:
    image: node:20-alpine
    container_name: gapi-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5176:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://backend:8080
    networks:
      - gapi-network

volumes:
  frontend_node_modules: