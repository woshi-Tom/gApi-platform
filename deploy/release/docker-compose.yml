# gAPI Platform - Docker Compose for Release Package
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: gapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-gapi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gapi} -d ${POSTGRES_DB:-gapi}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gapi-network

  redis:
    image: redis:7-alpine
    container_name: gapi-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-CHANGE_ME}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CHANGE_ME}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gapi-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: gapi-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gapi}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-CHANGE_ME}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - gapi-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gapi-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      GAPI_MODE: production
      GAPI_SERVER_PORT: "8080"
      GAPI_DB_HOST: postgres
      GAPI_DB_PORT: "5432"
      GAPI_DB_USER: ${POSTGRES_USER:-gapi}
      GAPI_DB_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      GAPI_DB_NAME: ${POSTGRES_DB:-gapi}
      GAPI_REDIS_HOST: redis
      GAPI_REDIS_PORT: "6379"
      GAPI_REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME}
      GAPI_RABBITMQ_HOST: rabbitmq
      GAPI_RABBITMQ_PORT: "5672"
      GAPI_RABBITMQ_USER: ${RABBITMQ_USER:-gapi}
      GAPI_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-CHANGE_ME}
      GAPI_JWT_SECRET: ${JWT_SECRET}
      GAPI_ENCRYPT_KEY: ${ENCRYPT_KEY}
      GAPI_FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GAPI_ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL:-http://localhost:5174}
      GAPI_ALIPAY_ENABLED: ${ALIPAY_ENABLED:-false}
      GAPI_ALIPAY_SANDBOX: ${ALIPAY_SANDBOX:-true}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - gapi-network

  frontend:
    image: nginx:alpine
    container_name: gapi-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:5173:80"
    networks:
      - gapi-network

  admin:
    image: nginx:alpine
    container_name: gapi-admin
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./admin:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:5174:80"
    networks:
      - gapi-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  gapi-network:
    driver: bridge
