name: Build and Release

env:
  NODE_VERSION: '22'
  GO_VERSION: '1.24'

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  # =============================================
  # Backend: cross-compile for Linux and Windows
  # =============================================
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary_name: gapi-server
          - goos: windows
            goarch: amd64
            binary_name: gapi-server.exe
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-w -s" -o ${{ matrix.binary_name }} ./cmd/server

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ matrix.goos }}-${{ matrix.goarch }}
          path: backend/${{ matrix.binary_name }}

  # =============================================
  # Backend docs (Swagger)
  # =============================================
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload docs
        uses: actions/upload-artifact@v7
        with:
          name: backend-docs
          path: backend/docs/

  # =============================================
  # Frontend: user-facing
  # =============================================
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/

  # =============================================
  # Frontend: admin panel
  # =============================================
  build-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Admin
        run: npm run build:admin

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: admin-dist
          path: frontend/dist-admin/

  # =============================================
  # Release: package everything for GitHub Release
  # =============================================
  release:
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-docs
      - build-frontend
      - build-admin
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare Release Directory
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          DIR="gapi-platform-${VERSION}"
          mkdir -p "${DIR}"

          # --- Backend binaries ---
          mkdir -p "${DIR}/bin/linux/amd64"
          mkdir -p "${DIR}/bin/windows/amd64"

          cp artifacts/backend-linux-amd64/gapi-server "${DIR}/bin/linux/amd64/"
          cp artifacts/backend-windows-amd64/gapi-server.exe "${DIR}/bin/windows/amd64/"

          # --- Backend docs ---
          mkdir -p "${DIR}/docs"
          cp -r artifacts/backend-docs/* "${DIR}/docs/"

          # --- Frontend builds ---
          cp -r artifacts/frontend-dist/. "${DIR}/frontend/"

          # Admin: rename admin.html → index.html for nginx SPA routing
          cp -r artifacts/admin-dist/. "${DIR}/admin/"
          if [ -f "${DIR}/admin/admin.html" ]; then
            mv "${DIR}/admin/admin.html" "${DIR}/admin/index.html"
            sed -i 's|/admin\.html|/index.html|g' "${DIR}/admin/index.html" 2>/dev/null || true
            sed -i 's|admin\.html|index.html|g' "${DIR}/admin/index.html" 2>/dev/null || true
          fi

          # --- Release infrastructure ---
          cp deploy/release/docker-compose.yml "${DIR}/"
          cp deploy/release/Dockerfile.backend "${DIR}/"
          cp deploy/release/nginx.conf "${DIR}/"
          cp deploy/release/.env.example "${DIR}/"
          cp deploy/release/config.yaml.example "${DIR}/"
          cp deploy/release/start.sh "${DIR}/"
          cp deploy/release/start.bat "${DIR}/"

          # --- Documentation ---
          cp README.md "${DIR}/" 2>/dev/null || true
          cp CHANGELOG.md "${DIR}/" 2>/dev/null || true

          # --- Generate package README ---
          sed "s/{VERSION}/${VERSION}/g" release-readme.txt > "${DIR}/README.md"

          # --- Version file ---
          echo "gAPI Platform v${VERSION}" > "${DIR}/VERSION.txt"

          # Make scripts executable
          chmod +x "${DIR}/start.sh"

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "DIR=${DIR}" >> $GITHUB_ENV

      - name: Create Release Archives
        run: |
          VERSION=${{ env.VERSION }}
          DIR=${{ env.DIR }}

          # tar.gz (Linux/Mac)
          tar -czvf "gapi-platform-${VERSION}.tar.gz" "${DIR}"

          # zip (Windows)
          if command -v zip &>/dev/null; then
            zip -r "gapi-platform-${VERSION}.zip" "${DIR}"
          else
            apt-get update -qq && apt-get install -y -qq zip
            zip -r "gapi-platform-${VERSION}.zip" "${DIR}"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            gapi-platform-*.tar.gz
            gapi-platform-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
