name: Build and Release

env:
  NODE_VERSION: '22'
  GO_VERSION: '1.24'

on:
  push:
    branches: [ main, dev-tom ]
    tags:
      - 'v*'
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  # =============================================
  # Backend: cross-compile for Linux and Windows
  # =============================================
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary_name: gapi-server
          - goos: windows
            goarch: amd64
            binary_name: gapi-server.exe
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run vet
        run: go vet ./...

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-w -s" -o ${{ matrix.binary_name }} ./cmd/server

      - name: Smoke Test (binary runs)
        if: matrix.goos == 'linux'
        run: |
          file ./${{ matrix.binary_name }}
          test -s ./${{ matrix.binary_name }}
          echo "Smoke test passed: binary is valid and non-empty"

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-${{ matrix.goos }}-${{ matrix.goarch }}
          path: backend/${{ matrix.binary_name }}

  # =============================================
  # Backend docs (Swagger)
  # =============================================
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Upload docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-docs
          path: backend/docs/

  # =============================================
  # Frontend: user-facing
  # =============================================
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx vue-tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist
          path: frontend/dist/

  # =============================================
  # Frontend: admin panel
  # =============================================
  build-admin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check Admin
        run: npx vue-tsc --noEmit

      - name: Build Admin
        run: npm run build:admin

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: admin-dist
          path: frontend/dist-admin/

  # =============================================
  # Release: package everything for GitHub Release
  # =============================================
  release:
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-docs
      - build-frontend
      - build-admin
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Prepare Release Directory
        run: |
          # Extract version: tag (refs/tags/v1.0.0 -> 1.0.0) or branch name (refs/heads/dev-tom -> dev-tom)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${GITHUB_REF#refs/heads/}
          fi
          DIR="gapi-platform-${VERSION}"
          mkdir -p "${DIR}"

          # --- Backend binaries ---
          mkdir -p "${DIR}/bin/linux/amd64"
          mkdir -p "${DIR}/bin/windows/amd64"

          cp artifacts/backend-linux-amd64/gapi-server "${DIR}/bin/linux/amd64/"
          cp artifacts/backend-windows-amd64/gapi-server.exe "${DIR}/bin/windows/amd64/"

          # --- Backend docs ---
          mkdir -p "${DIR}/docs"
          cp -r artifacts/backend-docs/* "${DIR}/docs/"

          # --- Frontend builds ---
          cp -r artifacts/frontend-dist/. "${DIR}/frontend/"

          # Admin: rename admin.html → index.html for nginx SPA routing
          cp -r artifacts/admin-dist/. "${DIR}/admin/"
          if [ -f "${DIR}/admin/admin.html" ]; then
            mv "${DIR}/admin/admin.html" "${DIR}/admin/index.html"
            sed -i 's|/admin\.html|/index.html|g' "${DIR}/admin/index.html" 2>/dev/null || true
            sed -i 's|admin\.html|index.html|g' "${DIR}/admin/index.html" 2>/dev/null || true
          fi

          # --- Release infrastructure ---
          cp deploy/release/docker-compose.yml "${DIR}/"
          cp deploy/release/Dockerfile.backend "${DIR}/"
          cp deploy/release/redis.conf "${DIR}/"
          cp deploy/release/nginx.conf "${DIR}/"
          cp deploy/release/.env.example "${DIR}/"
          cp deploy/release/config.yaml.example "${DIR}/"
          cp deploy/release/start.sh "${DIR}/"
          cp deploy/release/start.bat "${DIR}/"

          # --- Documentation ---
          cp README.md "${DIR}/" 2>/dev/null || true
          cp CHANGELOG.md "${DIR}/" 2>/dev/null || true

          # --- Generate package README ---
          sed "s|{VERSION}|${VERSION}|g" release-readme.txt > "${DIR}/README.md"

          # --- Version file ---
          echo "gAPI Platform v${VERSION}" > "${DIR}/VERSION.txt"

          # Make scripts executable
          chmod +x "${DIR}/start.sh"

          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "DIR=${DIR}" >> $GITHUB_ENV

      - name: Create Release Archives
        run: |
          VERSION=${{ env.VERSION }}
          DIR=${{ env.DIR }}

          # Linux (tar.gz)
          tar -czvf "gapi-platform-${VERSION}-linux-amd64.tar.gz" "${DIR}"

          # Windows (zip)
          if command -v zip &>/dev/null; then
            zip -r "gapi-platform-${VERSION}-windows-amd64.zip" "${DIR}"
          else
            apt-get update -qq && apt-get install -y -qq zip
            zip -r "gapi-platform-${VERSION}-windows-amd64.zip" "${DIR}"
          fi

      - name: Verify Release Archives
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Verify archive integrity and expected files exist
          tar -tzf gapi-platform-*-linux-amd64.tar.gz | head -20
          echo "---"
          unzip -l gapi-platform-*-windows-amd64.zip 2>/dev/null | head -20 || echo "zip not available for listing"
          echo "Archive verification passed"

      - name: Generate Checksums
        if: startsWith(github.ref, 'refs/tags/v')
        run: sha256sum gapi-platform-*.tar.gz gapi-platform-*.zip > SHA256SUMS

      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "## 下载说明" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "| 文件 | 适用平台 |" >> RELEASE_NOTES.md
          echo "|------|----------|" >> RELEASE_NOTES.md
          echo "| *-linux-amd64.tar.gz | Linux / macOS |" >> RELEASE_NOTES.md
          echo "| *-windows-amd64.zip | Windows |" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## 快速部署" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "1. 解压对应平台的压缩包" >> RELEASE_NOTES.md
          echo "2. 复制 .env.example 为 .env 并编辑密码" >> RELEASE_NOTES.md
          echo "3. 执行 ./start.sh (Linux/macOS) 或 start.bat (Windows)" >> RELEASE_NOTES.md
          echo "4. 访问 http://localhost:5173 / http://localhost:5174" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "详细变更日志见压缩包内的 CHANGELOG.md。" >> RELEASE_NOTES.md

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: |
            gapi-platform-*.tar.gz
            gapi-platform-*.zip
            SHA256SUMS
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
